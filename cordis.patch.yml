# @nethiel/dsh-llm-keypool — one row, three features.
#
# DSH identifies a browser bundle by its package name, and a package mounted
# through several Loader entries composes twice ("duplicate factory
# registration"). So the package is mounted through exactly ONE row; this row
# applies the route-pool and credential-rotation behaviors in-process.
#
# The row is ENABLED and inert until something is configured:
#  - routePool is inert while its pool is empty (the panel writes the pool file);
#  - keyRotate stays off unless `enabled: true` (or activeRef + refs are set),
#    because rotating credentials needs an explicit opt-in.
#
# The row `id` is the config namespace: keep it `llm-keypool`.
- insert:
    - id: llm-keypool
      name: '@nethiel/dsh-llm-keypool'
      config:
        routePool:
          pools: []
        keyRotate:
          enabled: false
          activeRef: ''
          refs: []
